<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Data flow of the Rain &amp; Mobility in Bergen prototype</title>
  <defs>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b5cad"/>
    </marker>
    <marker id="arrow-change" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08214"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d8dde3; stroke-width: 1.5; }
      .box-core { fill: #eef4fb; stroke: #0b5cad; stroke-width: 1.5; }
      .title { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .text { font-size: 11.5px; fill: #57606a; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #1f2328; }
      .data { stroke: #57606a; stroke-width: 1.6; fill: none; }
      .event { stroke: #0b5cad; stroke-width: 1.6; fill: none; }
      .change { stroke: #e08214; stroke-width: 1.6; fill: none; }
      .label { font-size: 11px; fill: #57606a; }
      .label-event { font-size: 11px; fill: #0b5cad; font-weight: 600; }
      .label-change { font-size: 11px; fill: #e08214; font-weight: 600; }
    </style>
  </defs>

  <rect width="900" height="560" fill="#f5f6f8"/>

  <!-- Row 1: data pipeline -->
  <rect class="box" x="24" y="30" width="200" height="84" rx="6"/>
  <text class="title" x="40" y="54">Dataset (CPI)</text>
  <text class="mono" x="40" y="74">data/</text>
  <text class="mono" x="40" y="89">bergen_daily_clean.csv</text>
  <text class="text" x="40" y="105">1,629 days × 11 columns</text>

  <rect class="box" x="286" y="20" width="290" height="104" rx="6"/>
  <text class="title" x="302" y="44">js/data.js — preprocessing</text>
  <text class="mono" x="302" y="64">loadData()  types, NaN, id = date</text>
  <text class="mono" x="302" y="80">getScatterData()   + correlation()</text>
  <text class="mono" x="302" y="96">getHorizonData()   4 strips, 7-day dev</text>
  <text class="mono" x="302" y="112">getCalendarData()  week × weekday grid</text>

  <rect class="box-core" x="638" y="20" width="238" height="104" rx="6"/>
  <text class="title" x="654" y="44">js/main.js — wiring</text>
  <text class="mono" x="654" y="64">CHARTS registry</text>
  <text class="mono" x="654" y="80">for each chart:</text>
  <text class="mono" x="654" y="96">  create(el, data, dispatcher)</text>
  <text class="mono" x="654" y="112">  register(id, chart)</text>

  <path class="data" d="M224,72 L284,72" marker-end="url(#arrow-data)"/>
  <text class="label" x="232" y="64">d3.csv</text>
  <path class="data" d="M576,72 L636,72" marker-end="url(#arrow-data)"/>
  <text class="label" x="587" y="64">rows</text>

  <!-- main.js → charts (data bus) -->
  <path class="data" d="M757,124 L757,160 L170,160"/>
  <path class="data" d="M170,160 L170,192" marker-end="url(#arrow-data)"/>
  <path class="data" d="M450,160 L450,192" marker-end="url(#arrow-data)"/>
  <path class="data" d="M730,160 L730,192" marker-end="url(#arrow-data)"/>
  <text class="label" x="470" y="152">prepared data per idiom → create()</text>

  <!-- Row 2: chart modules -->
  <rect class="box" x="70" y="194" width="200" height="72" rx="6" stroke="#1f2328"/>
  <text class="title" x="86" y="218">charts/horizon.js</text>
  <text class="text" x="86" y="237">year zoom, time brush, hover, rug</text>
  <text class="text" x="86" y="254">emits: zoomTime, brushTime, hover</text>

  <rect class="box" x="350" y="194" width="200" height="72" rx="6" stroke="#1f2328"/>
  <text class="title" x="366" y="218">charts/scatter.js</text>
  <text class="text" x="366" y="237">brush, click, re-encode, r</text>
  <text class="text" x="366" y="254">emits: brushPoints, hover, encode</text>

  <rect class="box" x="610" y="194" width="272" height="72" rx="6" stroke="#1f2328"/>
  <text class="title" x="626" y="218">charts/calendar.js</text>
  <text class="text" x="626" y="237">toggle, click/drag, weekday &amp; year labels</text>
  <text class="text" x="626" y="254">emits: brushPoints, zoomTime, encode, hover</text>

  <!-- charts ↔ state: intents down (blue), change up (orange) -->
  <path class="event" d="M140,266 L140,368" marker-end="url(#arrow-event)"/>
  <path class="change" d="M200,368 L200,268" marker-end="url(#arrow-change)"/>
  <path class="event" d="M420,266 L420,368" marker-end="url(#arrow-event)"/>
  <path class="change" d="M480,368 L480,268" marker-end="url(#arrow-change)"/>
  <path class="event" d="M700,266 L700,368" marker-end="url(#arrow-event)"/>
  <path class="change" d="M760,368 L760,268" marker-end="url(#arrow-change)"/>

  <text class="label-event" x="222" y="304">▼ emit intent</text>
  <text class="label" x="222" y="319">dispatcher.call(…)</text>
  <text class="label-change" x="512" y="304">▲ "change" event</text>
  <text class="label" x="512" y="319">chart.update(state, reason)</text>

  <!-- Row 3: shared state -->
  <rect class="box-core" x="70" y="370" width="760" height="112" rx="6"/>
  <text class="title" x="86" y="394">js/state.js — shared state + d3.dispatch event bus</text>
  <text class="mono" x="86" y="416">state = { zoom, timeRange, selectedIds, selectionSource, hoveredId, encodings }</text>
  <text class="mono" x="86" y="436">intents: zoomTime · brushTime · brushPoints · hover · encode · reset  →  update state  →  "change"</text>
  <text class="text" x="86" y="458">Charts never call each other: all linking goes through this one module, keyed by day id ("YYYY-MM-DD").</text>
  <text class="text" x="86" y="474">A new chart links to every existing chart simply by registering for "change".</text>

  <!-- Global UI -->
  <rect class="box" x="70" y="504" width="220" height="40" rx="6"/>
  <text class="title" x="86" y="529">Header: Reset button</text>
  <path class="event" d="M180,504 L180,484" marker-end="url(#arrow-event)"/>
  <text class="label-event" x="190" y="498">reset</text>

  <rect class="box" x="610" y="504" width="220" height="40" rx="6"/>
  <text class="title" x="626" y="529">Header: selection status</text>
  <path class="change" d="M720,484 L720,502" marker-end="url(#arrow-change)"/>

  <!-- Legend -->
  <line class="data" x1="330" y1="512" x2="360" y2="512"/><text class="label" x="366" y="516">data flow</text>
  <line class="event" x1="330" y1="528" x2="360" y2="528"/><text class="label" x="366" y="532">intent events</text>
  <line class="change" x1="450" y1="512" x2="480" y2="512"/><text class="label" x="486" y="516">state change</text>
  <text class="label" x="330" y="550">shared modules: theme · legend · tooltip · expand</text>
</svg>
