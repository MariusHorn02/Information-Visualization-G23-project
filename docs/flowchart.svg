<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>Data flow of the Rain &amp; Mobility in Bergen prototype (Checkpoint IV)</title>
  <defs>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b5cad"/>
    </marker>
    <marker id="arrow-change" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08214"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d8dde3; stroke-width: 1.5; }
      .box-core { fill: #eef4fb; stroke: #0b5cad; stroke-width: 1.5; }
      .box-new { fill: #eefaf1; stroke: #1a7f37; stroke-width: 1.5; }
      .title { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .text { font-size: 11.5px; fill: #57606a; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #1f2328; }
      .new { fill: #1a7f37; font-weight: 700; }
      .data { stroke: #57606a; stroke-width: 1.6; fill: none; }
      .event { stroke: #0b5cad; stroke-width: 1.6; fill: none; }
      .change { stroke: #e08214; stroke-width: 1.6; fill: none; }
      .label { font-size: 11px; fill: #57606a; }
      .label-event { font-size: 11px; fill: #0b5cad; font-weight: 600; }
      .label-change { font-size: 11px; fill: #e08214; font-weight: 600; }
    </style>
  </defs>

  <rect width="900" height="600" fill="#f5f6f8"/>

  <!-- Row 1: data pipeline -->
  <rect class="box" x="24" y="30" width="200" height="84" rx="6"/>
  <text class="title" x="40" y="54">Dataset (CPI)</text>
  <text class="mono" x="40" y="74">data/</text>
  <text class="mono" x="40" y="89">bergen_daily_clean.csv</text>
  <text class="text" x="40" y="105">1,629 days × 11 columns</text>

  <rect class="box" x="286" y="20" width="290" height="104" rx="6"/>
  <text class="title" x="302" y="44">js/data.js — preprocessing</text>
  <text class="mono" x="302" y="64">loadData()  types, NaN, id = date</text>
  <text class="mono" x="302" y="80">getScatterData()   + correlation()</text>
  <text class="mono" x="302" y="96">getHorizonData()   4 strips, 7-day dev</text>
  <text class="mono" x="302" y="112">getCalendarData()  week × weekday grid</text>

  <rect class="box-core" x="638" y="20" width="238" height="104" rx="6"/>
  <text class="title" x="654" y="44">js/main.js — wiring</text>
  <text class="mono" x="654" y="64">CHARTS registry</text>
  <text class="mono" x="654" y="80">load data + modules</text>
  <text class="mono" x="654" y="96">  in parallel <tspan class="new">new</tspan></text>
  <text class="mono" x="654" y="112">create() + register()</text>

  <path class="data" d="M224,72 L284,72" marker-end="url(#arrow-data)"/>
  <text class="label" x="232" y="64">d3.csv</text>
  <path class="data" d="M576,72 L636,72" marker-end="url(#arrow-data)"/>
  <text class="label" x="587" y="64">rows</text>

  <!-- main.js → charts (data bus) -->
  <path class="data" d="M757,124 L757,160 L155,160"/>
  <path class="data" d="M155,160 L155,192" marker-end="url(#arrow-data)"/>
  <path class="data" d="M440,160 L440,192" marker-end="url(#arrow-data)"/>
  <path class="data" d="M741,160 L741,192" marker-end="url(#arrow-data)"/>
  <text class="label" x="470" y="152">prepared data per idiom → create()</text>

  <!-- Row 2: chart modules -->
  <rect class="box" x="30" y="194" width="250" height="88" rx="6" stroke="#1f2328"/>
  <text class="title" x="46" y="218">charts/horizon.js</text>
  <text class="text" x="46" y="237">year zoom, time brush, hover, rug</text>
  <text class="text" x="46" y="253"><tspan class="new">new</tspan> zoom/pan, show one strip, greying</text>
  <text class="text" x="46" y="271">emits: zoomTime, brushTime, hover</text>

  <rect class="box" x="310" y="194" width="260" height="88" rx="6" stroke="#1f2328"/>
  <text class="title" x="326" y="218">charts/scatter.js</text>
  <text class="text" x="326" y="237">brush, click, re-encode, r per group</text>
  <text class="text" x="326" y="253"><tspan class="new">new</tspan> zoom/pan, legend = filter</text>
  <text class="text" x="326" y="271">emits: brushPoints, <tspan class="new">filter</tspan>, hover, encode</text>

  <rect class="box" x="594" y="194" width="292" height="88" rx="6" stroke="#1f2328"/>
  <text class="title" x="610" y="218">charts/calendar.js</text>
  <text class="text" x="610" y="237">measure toggle, click/drag days</text>
  <text class="text" x="610" y="253"><tspan class="new">new</tspan> multi-select days, months, weekdays, years</text>
  <text class="text" x="610" y="271">emits: brushPoints, <tspan class="new">filter</tspan>, encode, hover</text>

  <!-- charts ↔ state: intents down (blue), change up (orange) -->
  <path class="event" d="M125,282 L125,384" marker-end="url(#arrow-event)"/>
  <path class="change" d="M185,384 L185,284" marker-end="url(#arrow-change)"/>
  <path class="event" d="M410,282 L410,384" marker-end="url(#arrow-event)"/>
  <path class="change" d="M470,384 L470,284" marker-end="url(#arrow-change)"/>
  <path class="event" d="M711,282 L711,384" marker-end="url(#arrow-event)"/>
  <path class="change" d="M771,384 L771,284" marker-end="url(#arrow-change)"/>

  <text class="label-event" x="200" y="320">▼ emit intent</text>
  <text class="label" x="200" y="335">dispatcher.call(…)</text>
  <text class="label-change" x="492" y="320">▲ "change" event</text>
  <text class="label" x="492" y="335">chart.update(state, reason)</text>

  <!-- Row 3: shared state -->
  <rect class="box-core" x="30" y="386" width="852" height="134" rx="6"/>
  <text class="title" x="46" y="410">js/state.js — shared state + d3.dispatch event bus</text>
  <text class="mono" x="46" y="432">state = { zoom, timeRange, selectedIds, selectionSource, <tspan class="new">filterIds, filterSource</tspan>, hoveredId, encodings }</text>
  <text class="mono" x="46" y="451">intents: zoomTime · brushTime · brushPoints · <tspan class="new">filter</tspan> · hover · encode · reset  →  update state  →  "change"</text>
  <text class="mono" x="46" y="470"><tspan class="new">new</tspan> isActive(day) = in period AND in selection AND in legend filter: the one rule every chart uses</text>
  <text class="text" x="46" y="492">Charts never call each other: all linking goes through this one module, keyed by day id ("YYYY-MM-DD").</text>
  <text class="text" x="46" y="508">A new chart links to every existing chart simply by registering for "change".</text>

  <!-- Global UI -->
  <rect class="box" x="30" y="544" width="220" height="40" rx="6"/>
  <text class="title" x="46" y="569">Header: Reset button</text>
  <path class="event" d="M140,544 L140,522" marker-end="url(#arrow-event)"/>
  <text class="label-event" x="150" y="538">reset</text>

  <rect class="box" x="662" y="544" width="220" height="40" rx="6"/>
  <text class="title" x="678" y="569">Header: selection status</text>
  <path class="change" d="M772,522 L772,542" marker-end="url(#arrow-change)"/>

  <!-- Legend -->
  <line class="data" x1="290" y1="552" x2="320" y2="552"/><text class="label" x="326" y="556">data flow</text>
  <line class="event" x1="290" y1="568" x2="320" y2="568"/><text class="label" x="326" y="572">intent events</text>
  <line class="change" x1="420" y1="552" x2="450" y2="552"/><text class="label" x="456" y="556">state change</text>
  <text class="label" x="420" y="572"><tspan class="new">new</tspan> = changed since Checkpoint III</text>
  <text class="label" x="290" y="592">shared modules: theme · legend · tooltip · <tspan class="new">zoom (replaces expand)</tspan></text>
</svg>
