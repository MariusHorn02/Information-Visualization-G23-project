<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rain & Mobility in Bergen</title>
  <link rel="icon" href="data:,"> 
  <link rel="stylesheet" href="css/style.css">
  <script src="lib/d3.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Rain &amp; Mobility in Bergen</h1>
    <span class="spacer"></span>
    <span class="selection-status" id="selection-status" aria-live="polite"></span>
    <button class="btn" id="reset-btn" type="button">Reset</button>
  </header>

  <main class="dashboard">
    <section class="panel panel--horizon" aria-labelledby="h-horizon">
      <div class="panel__head">
        <h2 id="h-horizon">Trends over time</h2>
        <span class="panel__sub">vs. 2021–2025 average · pick a year, or drag to mark a period</span>
      </div>
      <div class="panel__body" data-chart="horizon"></div>
    </section>

    <section class="panel panel--scatter" aria-labelledby="h-scatter">
      <div class="panel__head">
        <h2 id="h-scatter">Rain vs. mobility</h2>
        <span class="panel__sub">One point per day · click or drag to select</span>
      </div>
      <div class="panel__body" data-chart="scatter"></div>
    </section>

    <section class="panel panel--calendar" aria-labelledby="h-calendar">
      <div class="panel__head">
        <h2 id="h-calendar">Daily calendar</h2>
        <span class="panel__sub">One cell per day · click or drag to select</span>
      </div>
      <div class="panel__body" data-chart="calendar"></div>
    </section>
  </main>
</body>
</html>
